include hyde.conf

# The wallpaper's own colours, generated by matugen (~/.config/matugen/config.toml) whenever the
# wallpaper changes. It comes after hyde.conf on purpose: kitty lets the last value win, so this
# overrides the window, cursor, selection and tab colours that HyDE just set, and leaves the rest alone.
include wallpaper.conf

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# remap to open new kitty tab in the same directory (default is home dir)
# map ctrl+shift+t            new_tab_with_cwd

# Uncomment the following 4 lines to minimize kitty latency (higher energy usage)
# input_delay 0
# repaint_delay 2
# sync_to_monitor no
# wayland_enable_ime no

# Your own settings, last so they win. The file is yours and optional: kitty ignores it when it is missing.
include user.conf
