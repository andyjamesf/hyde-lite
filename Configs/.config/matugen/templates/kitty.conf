# Generated by matugen from the wallpaper. Do not edit: see
# ~/.config/matugen/templates/kitty.conf.
#
# kitty.conf includes this after HyDE's own theme.conf, so what is set here wins
# and everything left out keeps HyDE's value. Only the chrome is set: the window,
# the cursor, the selection and the tabs, which is what has to match the island.
# The sixteen ANSI colours stay HyDE's in dark mode -- they also come from the wallpaper when
# wallbash mode is on, and Material You has no notion of eight terminal hues. HyDE's palette is a
# pastel one made for dark backgrounds (blue #81a2be on #e2e2e2 is about 1.9:1), so in light mode
# the sixteen are replaced by darker hues, each at least 4.5:1 on a light background.

background              {{colors.background.default.hex}}
foreground              {{colors.on_background.default.hex}}

cursor                  {{colors.primary.default.hex}}
cursor_text_color       {{colors.on_primary.default.hex}}

selection_background    {{colors.primary_container.default.hex}}
selection_foreground    {{colors.on_primary_container.default.hex}}

url_color               {{colors.primary.default.hex}}

active_border_color     {{colors.primary.default.hex}}
inactive_border_color   {{colors.outline_variant.default.hex}}
bell_border_color       {{colors.error.default.hex}}

active_tab_background   {{colors.primary.default.hex}}
active_tab_foreground   {{colors.on_primary.default.hex}}
inactive_tab_background {{colors.surface_container.default.hex}}
inactive_tab_foreground {{colors.on_surface_variant.default.hex}}
tab_bar_background      {{colors.surface_container_low.default.hex}}
<* if {{is_dark_mode}} *><* else *>
color0  #1d2021
color1  #b3261e
color2  #2e6b1f
color3  #7a5200
color4  #1a5fb4
color5  #8a3a9e
color6  #006a66
color7  #4a4a4a
color8  #555555
color9  #c0211f
color10 #2a6f2a
color11 #855a00
color12 #0f55b5
color13 #963aa8
color14 #006d68
color15 #2b2b2b
<* endif *>
