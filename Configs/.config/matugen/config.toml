# Matugen: the Material You palette of the current wallpaper, and the files that
# are written from it.
#
# The shell runs this (theme/Palettes.qml in the island) on every wallpaper
# change: it reads the palette as JSON for itself, and matugen writes the
# templates below at the same time, so the island and the programs can never
# drift apart on the same wallpaper.
#
# HyDE colours the same programs from its own extraction of the wallpaper
# (wallbash, `enableWallDcol` in its state). These templates are written after
# HyDE's and only where a program can be made to read a second file last.

[config]
# The island reloads itself; nothing here should go reloading other programs.
reload_apps = false

[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland.lua"
output_path = "~/.config/hypr/wallpaper.lua"
# Hyprland rereads its whole config, which is where the file above is turned
# into border colours. Nothing else here needs it, so the hook is on this one.
post_hook = "hyprctl reload >/dev/null 2>&1 || true"

# GTK3 and GTK4 get the same file, each imported from the gtk.css beside it.
# Separate outputs rather than one shared path because the two toolkits read
# different directories and nothing guarantees both exist.
# The post_hooks put the @import in place when it is not there yet, so a machine
# that has only just pulled the repo gets it without a step by hand. GTK3 has no
# gtk.css of its own here, so it is created; GTK4's is the Nordic theme, 6000
# lines of it, and only gains one line at the end -- where a later
# @define-color wins over the theme's own.
[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-3.0/wallpaper.css"
post_hook = "grep -qs wallpaper.css ~/.config/gtk-3.0/gtk.css || printf '@import url(\"wallpaper.css\");\n' >> ~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/wallpaper.css"
post_hook = "grep -qs wallpaper.css ~/.config/gtk-4.0/gtk.css || printf '\n@import url(\"wallpaper.css\");\n' >> ~/.config/gtk-4.0/gtk.css"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/kitty/wallpaper.conf"
# kitty rereads its config on SIGUSR1, so open windows recolour without a restart.
post_hook = "pkill -USR1 -x kitty || true"

# Zed: both a dark and a light theme in one file, so Zed's "system" mode picks the one that matches
# the mode matugen chose. Zed watches ~/.config/zed/themes and reloads a changed theme file at once.
# Its settings name the themes ("theme": {"mode": "system", "dark": "Matugen Dark", "light":
# "Matugen Light"}); matugen does not touch settings.json.
[templates.zed]
input_path = "~/.config/matugen/templates/zed.json"
output_path = "~/.config/zed/themes/matugen.json"

# Discord: DiscordRecolor's variables, written once and copied to every client's quickCss that
# exists (the same list HyDE's wallbash script used). Clients reload a changed quickCss themselves.
[templates.discord]
input_path = "~/.config/matugen/templates/discord.css"
output_path = "~/.cache/hyde/matugen/discord.css"
post_hook = "for d in ~/.config/Vencord/settings ~/.config/vesktop/settings ~/.var/app/dev.vencord.Vesktop/config/vesktop/settings; do [ -d \"$d\" ] && cp ~/.cache/hyde/matugen/discord.css \"$d/quickCss.css\"; done; for f in ~/.config/WebCord/Themes ~/.var/app/io.github.spacingbat3.webcord/config/WebCord/Themes; do [ -d \"$f\" ] && cp ~/.cache/hyde/matugen/discord.css \"$f/theme.css\"; done; true"

# Spotify, through spicetify's Sleek theme. The colour scheme is named Matugen; the hook selects it and
# applies it, and only when spicetify is installed and has been set up (`spicetify backup apply` once).
[templates.spicetify]
input_path = "~/.config/matugen/templates/spicetify.ini"
output_path = "~/.config/spicetify/Themes/Sleek/color.ini"
post_hook = "command -v spicetify >/dev/null 2>&1 && [ -d ~/.config/spicetify/Themes/Sleek ] && { spicetify config current_theme Sleek color_scheme Matugen && spicetify apply -q; } >/dev/null 2>&1 || true"

# VS Code and VSCodium: a theme extension, so there is nothing to install from a marketplace. Select
# "Matugen" once under Preferences: Color Theme; VS Code rereads a changed theme file by itself.
# The hook copies the extension to VSCodium's folder when that exists.
[templates.vscode-theme]
input_path = "~/.config/matugen/templates/vscode-theme.json"
output_path = "~/.vscode/extensions/hyde-lite.matugen-1.0.0/themes/matugen.json"

[templates.vscode-package]
input_path = "~/.config/matugen/templates/vscode-package.json"
output_path = "~/.vscode/extensions/hyde-lite.matugen-1.0.0/package.json"
post_hook = "[ -d ~/.vscode-oss/extensions ] && mkdir -p ~/.vscode-oss/extensions/hyde-lite.matugen-1.0.0 && cp -r ~/.vscode/extensions/hyde-lite.matugen-1.0.0/. ~/.vscode-oss/extensions/hyde-lite.matugen-1.0.0/ || true"
