<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Icon glyphs (the shell menus, waybar, rofi) live in the Private Use Area. The Microsoft core
  fonts claim a scattering of those codepoints and draw a dot or nothing there, and fontconfig
  picked them over the Nerd Font: U+F023 (lock), U+F009, U+F019, U+F02E and U+F031 came out blank
  in the HyDE menu.

  Their PUA coverage is dropped at scan time, so they are never chosen as a fallback for an icon.
  Normal text in these fonts is untouched. Nerd Fonts and Material Symbols (which the shell uses
  for its own icons) keep their PUA, so they win instead.

  One block per family: fontconfig does not support several <string>s in a single <test>.
  Run `fc-cache -rf` after editing this file.
-->
<fontconfig>
  <match target="scan">
    <test name="family" compare="eq">
      <string>Arial</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range>
            <int>0xE000</int>
            <int>0xF8FF</int>
          </range>
        </charset>
      </minus>
    </edit>
  </match>
  <match target="scan">
    <test name="family" compare="eq">
      <string>Arial Black</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range>
            <int>0xE000</int>
            <int>0xF8FF</int>
          </range>
        </charset>
      </minus>
    </edit>
  </match>
  <match target="scan">
    <test name="family" compare="eq">
      <string>Courier New</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range>
            <int>0xE000</int>
            <int>0xF8FF</int>
          </range>
        </charset>
      </minus>
    </edit>
  </match>
  <match target="scan">
    <test name="family" compare="eq">
      <string>Georgia</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range>
            <int>0xE000</int>
            <int>0xF8FF</int>
          </range>
        </charset>
      </minus>
    </edit>
  </match>
  <match target="scan">
    <test name="family" compare="eq">
      <string>Times New Roman</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range>
            <int>0xE000</int>
            <int>0xF8FF</int>
          </range>
        </charset>
      </minus>
    </edit>
  </match>
  <match target="scan">
    <test name="family" compare="eq">
      <string>Trebuchet MS</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range>
            <int>0xE000</int>
            <int>0xF8FF</int>
          </range>
        </charset>
      </minus>
    </edit>
  </match>
  <match target="scan">
    <test name="family" compare="eq">
      <string>Verdana</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range>
            <int>0xE000</int>
            <int>0xF8FF</int>
          </range>
        </charset>
      </minus>
    </edit>
  </match>
  <match target="scan">
    <test name="family" compare="eq">
      <string>Webdings</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range>
            <int>0xE000</int>
            <int>0xF8FF</int>
          </range>
        </charset>
      </minus>
    </edit>
  </match>
</fontconfig>
