[General]
# Defaults of the Morphing Island login screen. The island writes theme.conf.user next to this file
# (scripts/sddm.py sync) with its current colours, font, sizes and wallpaper; that file wins.
# On a clean install there is no island running yet, so sddm.py install writes that file with the
# bundled font paths alone; the first sync afterwards fills in the colours and the rest.
wallpaper=background.png
wallpaperBlur=background-blur.png
veil=0.4
entry=rise
background=#15161e
surface=#1f2130
foreground=#e6e6f0
accent=#8ab4f8
accentContent=#10131a
dim=#a0a3b5
faint=#6c6f85
border=#2c2f42
shadow=#80000000
danger=#f28b82
hover=#1affffff
islandOpacity=0.94
font=Inter
fontFile=
iconFontFile=
iconFont=JetBrainsMono Nerd Font
fontSize=13
springOmega=22
pillHeight=36
pillTopMargin=6
pillMinWidth=128
cardWidth=380
cardPadding=30
cardRadius=30
cardOffset=-0.04
clockSize=64
avatarSize=76
fieldWidth=300
fieldHeight=46
locale=en_US
timeFormat=HH:mm
longDateFormat=dddd, d MMMM
