name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: Which shell?
      options: ["Morphing Island", "HyDE-style bar", "Both / not sure", "Neither (installer, colours, config)"]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: GPU and driver, Arch or derivative, `hyprctl version`, `quickshell --version`, install options used.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Installer logs are in `~/.local/state/hyde-lite-install/`. Remove anything personal before pasting.
      render: text
