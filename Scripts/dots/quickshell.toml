# Quickshell configuration: bar, notification server, OSD, launcher (apps/clipboard/calculator),
# control center, power menu and lockscreen, as the HyDE-style bar (bar/) or the Morphing Island
# (island/). Replaces waybar, dunst, wlogout (and rofi) in this lite fork; hyprlock (lockscreen
# fallback) is still installed by its own dot.
[quickshell]
description = "Quickshell desktop shell for HyDE (bar, notifications, launcher, control center, lockscreen)"

[[quickshell.dependency]]
pacman = [
    "quickshell",            # the shell runtime (QML)
    "inter-font",            # UI font
    # Icon font, as a system package on purpose: the login screen (SDDM) runs as its own user and
    # cannot read ~/.local/share/fonts, so a copy that only lives there leaves the first login
    # screen with no icons. Scripts/pkg_core.lst also lists it, but nothing in the lite install
    # path reads that file.
    "ttf-jetbrains-mono-nerd",
    "upower",                # battery (Quickshell.Services.UPower)
    "power-profiles-daemon", # power profiles (Quickshell.Services.UPower PowerProfiles)
    "wl-clipboard",          # wl-copy for the clipboard launcher
    "python",                # calendar (iCal) reader
    "python-gobject",        # system file chooser (xdg-desktop-portal) for the user photo
]
yay = [
    "ttf-material-symbols-variable-git", # icon font (variable: fill/weight are animated)
]
paru = [
    "ttf-material-symbols-variable-git", # icon font (variable: fill/weight are animated)
]

# The configuration's code: kept in sync with this repository (updates overwrite it). shell.qml picks
# the UI to run, island/ is the Morphing Island and bar/ the HyDE-style bar; the settings folders of
# both are the next entry.
[[quickshell.files]]
action = "sync"
source_root = "Configs/.config/quickshell"
target_root = "${XDG_CONFIG_HOME}/quickshell"
paths = [
    "shell.qml", "lock.qml", "sync.qml", "README.md",
    "bar/Shell.qml", "bar/README.md", "bar/components", "bar/modules", "bar/pickers", "bar/scripts", "bar/services",
    "island/Shell.qml", "island/README.md", "island/components", "island/core", "island/icons", "island/scripts",
    "island/sddm", "island/services", "island/theme",
]

# The user's settings (bar/config/config.json, bar/config/layouts.json, island/config/*.qml): only copied
# when missing, never overwritten.
[[quickshell.files]]
action = "preserve"
source_root = "Configs/.config/quickshell"
target_root = "${XDG_CONFIG_HOME}/quickshell"
paths = ["bar/config", "island/config"]
